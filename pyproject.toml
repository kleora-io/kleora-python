[project]
name = "kleora"
version = "0.0.0"
description = "Reserved for the official Kleora SDK. The first release is 0.1.0."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = ["Development Status :: 1 - Planning"]

[project.urls]
Homepage = "https://kleora.io"
Documentation = "https://kleora.io/en/docs"
Source = "https://github.com/kleora-io/kleora-python"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kleora"]
